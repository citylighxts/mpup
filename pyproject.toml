[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpup-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.6.0",
    "textstat>=0.7.3",
    "nltk>=3.8.1",
    "spacy>=3.7.0",
    "scipy>=1.12.0",
    "rouge-score>=0.1.2",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "datasets>=2.18.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
